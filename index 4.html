function build(N,sv){
 const m={},cols=[],lbr=[];let id=0;const k=Math.log2(N);
 const add=(a,b)=>{m[++id]=[a,b];return id};
 const pw=ids=>{const r=[];for(let i=0;i<ids.length;i+=2)r.push(add(["w",ids[i]],["w",ids[i+1]]));return r};
 const pl=ids=>{const r=[];for(let i=0;i<ids.length;i+=2)r.push(add(["l",ids[i]],["l",ids[i+1]]));return r};
 const lbPush=ids=>{lbr.push(ids);cols.push(["Przegr. "+lbr.length,ids])};
 let o=[];
 if(sv===2){const bits=Math.log2(N)-1;for(let i=0;i<N/2;i++){let r=0;for(let q=0;q<bits;q++)if(i&(1<<q))r|=1<<(bits-1-q);const top=r*2+1;o.push(top,N+1-top)}}
 else{o=N===16?[1,16,9,8,5,12,13,4,3,14,11,6,7,10,15,2]:[1,2];if(N!==16)while(o.length<N){const q=o.length*2;o=o.flatMap(x=>[x,q+1-x])}}
 const r1=[];for(let i=0;i<N;i+=2)r1.push(add(["p",o[i]],["p",o[i+1]]));
 cols.push(["Główna R1",r1]);
 let cur=pw(r1);cols.push(["Główna R2",cur]);
 lbPush(pl(r1));
 let lb=lbr[0].map((x,i)=>add(["w",x],["l",cur[cur.length-1-i]]));lbPush(lb);
 for(let r=3;r<k;r++){
  const c=pw(lb);lbPush(c);
  const c2=pw(cur);cols.push(["Główna R"+r,c2]);
  lb=c.map((x,i)=>add(["w",x],["l",r%2?c2[i]:c2[c2.length-1-i]]));lbPush(lb);cur=c2}
 if(lb.length>1){lb=pw(lb);lbPush(lb)}
 const wf=pw(cur);cols.push(["Finał główny",wf]);
 const lf=add(["w",lb[0]],["l",wf[0]]);cols.push(["Finał przegr.",[lf]]);
 const gf=add(["w",wf[0]],["w",lf]);cols.push(["FINAŁ",[gf]]);
 const PL=[];let p=4;for(const rd of lbr.slice().reverse()){PL.push([p,rd]);p+=rd.length}
 return{M:m,COLS:cols,PL,LBF:lf,GF:gf}}

function setWin(n,i){if(!(slot(M[n][0]).ok&&slot(M[n][1]).ok))return;

 if(d.some(m=>win(m)!==null)&&!sure('w'+n,'Zmiana usunie wyniki kolejnych meczów. Kliknij zawodnika jeszcze raz, aby potwierdzić.'))return;

 if(ni===null){delete wins[n];delete scores[n]}else{wins[n]=ni;if(sw(n)!==null&&sw(n)!==ni)delete scores[n]}

function setScore(n,i,v){const before=win(n);T={...T,scores:{...T.scores}};const s=(T.scores[n]||["",""]).slice();s[i]=v;T.scores[n]=s;

 save();render()}

function rrRes(n){const s=(T.scores||{})[n];if(!s||s[0]===""||s[1]===""||s[0]==null||s[1]==null)return null;const a=+s[0],b=+s[1];if(isNaN(a)||isNaN(b)||(a===b&&!T.draw))return null;return{a,b,w:a>b?1:b>a?2:0}}

function rrStats(){const N=T.size,S={};for(let i=1;i<=N;i++)S[i]={id:i,m:0,w:0,l:0,d:0,gf:0,ga:0};
 for(const x of rrList(N)){const r=rrRes(x.n);if(!r)continue;const A=S[x.a],B=S[x.b];A.m++;B.m++;A.gf+=r.a;A.ga+=r.b;B.gf+=r.b;B.ga+=r.a;if(r.w===1){A.w++;B.l++}else if(r.w===2){B.w++;A.l++}else{A.d++;B.d++}}
 for(const i in S){S[i].p=S[i].w+0.5*S[i].d;S[i].b=S[i].gf-S[i].ga}return S}
function rrH2H(g){const q={};g.forEach(x=>q[x]={p:0,b:0});for(const m of rrList(T.size)){if(!g.includes(m.a)||!g.includes(m.b))continue;const r=rrRes(m.n);if(!r)continue;q[m.a].b+=r.a-r.b;q[m.b].b+=r.b-r.a;if(r.w===1)q[m.a].p++;else if(r.w===2)q[m.b].p++;else{q[m.a].p+=.5;q[m.b].p+=.5}}

 h+='<details class="card jdg"'+(T.players.some(x=>(x||"").trim())?'':' open')+'><summary>👥 Zawodnicy – linia = numer z losowania</summary><div class="row adm"><button class="p" id="dr">🎲 Losuj numerki</button></div><textarea id="pl" rows="'+Math.min(16,N/2)+'" style="width:100%;box-sizing:border-box" placeholder="Jedno nazwisko w linii">'+esc(T.players.join("\n"))+'</textarea><div class="row"><button class="p" id="sp">Zapisz zawodników</button></div></details>';
 if(T.fmt==="rr"){h+=rrHtml(N)+statsHtml(N)+adminPanel()}else{
 if(zoom===null)zoom=N<=16?0.85:0.55;
 h+=bracketHtml(N);
 h+='</div><h2>Końcowa klasyfikacja</h2>';
 const pm0=placeMap(),by={};
 for(const x of Object.keys(pm0).map(Number).filter(real).sort((a,b)=>a-b))(by[pm0[x]]=by[pm0[x]]||[]).push(x);
 const slots=[1,2,3];for(const[p,rd]of PL)for(let i=0;i<rd.length;i++)slots.push(p);
 const done=win(GF)!==null,used={};
 const nm=x=>x?T.players[x-1]:'';
 const pod=(p,ic,cl)=>'<div class="pc '+cl+'"><div class="mdl">'+ic+'</div><div class="pn">'+esc(nm((by[p]||[])[0])||'—')+'</div><div class="pst">'+p+'. miejsce</div></div>';
 h+='<div class="podium">'+pod(2,'🥈','p2')+pod(1,'🥇','p1')+pod(3,'🥉','p3')+'</div><ol class="plist">';
 const li=(p,t)=>{h+='<li><span class="pb">'+p+'</span><span>'+esc(t||'—')+'</span></li>'};
 const Rn=[...Array(N).keys()].filter(i=>real(i+1)).length;let shown=3;
 if(!Rn)h+='<li style="list-style:none" class="note">Wpisz zawodników (karta „👥 Zawodnicy”) – klasyfikacja wypełni się sama.</li>';
 else for(const p of slots){const k=used[p]||0;used[p]=k+1;const x=(by[p]||[])[k];if(p<=3)continue;if(x){li(p,T.players[x-1]);shown++}else if(!done&&shown<Rn){li(p,'');shown++}}
 h+='</ol>'+statsHtml(N)+adminPanel();}
 const ob=document.querySelector('.board'),sc=ob?[ob.scrollLeft,ob.scrollTop]:[0,0];
 $("app").innerHTML=h;
 {const nb=document.querySelector('.board');if(nb){nb.scrollLeft=sc[0];nb.scrollTop=sc[1]}}
 document.querySelectorAll("[data-rr]").forEach(i=>i.onchange=()=>rrSet(i.dataset.rr,+i.dataset.i,i.value));
 if($("rd"))$("rd").onchange=e=>{T={...T,draw:e.target.checked};save();render()};
 document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const[n,f]=b.dataset.add.split("|");let v=b.parentElement.querySelector("input").value.trim();if(!v)v=f==="m"?"180":"✓";addStat(n,f,v)});
 document.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{const[n,f,i]=x.dataset.rm.split("|");rmStat(n,f,+i)});
 document.querySelectorAll(".mb .s").forEach(el=>el.onclick=e=>{if(e.target.tagName==="INPUT")return;const q=el.querySelector("input");setWin(+q.dataset.m,+q.dataset.i)});
 if($("zi"))$("zi").onclick=()=>{zoom=Math.min(1.5,zoom+.15);render()};if($("zo"))$("zo").onclick=()=>{zoom=Math.max(.3,zoom-.15);render()};
 $("dr").onclick=()=>{if(Object.keys(T.scores||{}).length&&!sure('dr','Nowe losowanie usunie wyniki. Kliknij 🎲 jeszcze raz, aby potwierdzić.'))return;const p=T.players.slice();while(p.length<N)p.push('');for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}T={...T,players:p,scores:{},wins:{},stats:{}};save();render()};
 document.querySelectorAll(".sz").forEach(b=>b.onclick=()=>{draftSize=+b.dataset.n;draftFmt=b.dataset.f||'ko';draft();render()});
 if($("sv"))$("sv").onclick=()=>np("sv","Turniej "+new Date().toLocaleDateString("pl"),false);
 $("sp").onclick=()=>{const p=$("pl").value.split("\n").map(x=>x.trim()).slice(0,N);T={...T,players:p};save();render()};
 document.body.classList.toggle("lock",!!T.locked);
 if($("sd"))$("sd").onchange=e=>{if(!sure("sd","Zmiana układu zmienia pary w 1. rundzie. Wybierz jeszcze raz, aby potwierdzić.")){e.target.value=String(T.sv===2?2:0);return}const id=tid,cur=secOf(list.find(x=>x.id===id)||T);ASGM={...ASGM,[id]:{...cur,sv:+e.target.value}};saveASG();T={...T,sv:+e.target.value};render()};
 document.querySelectorAll("[data-fm]").forEach(el=>el.onchange=()=>{const[a,b]=el.value.split("|"),id=el.dataset.fm;ASGM={...ASGM,[id]:{...(ASGM[id]||{}),series:a,cat:b}};saveASG();
  if(!vlist().find(x=>x.id===tid)){const v=vlist();tid=v[0]?v[0].id:null;fillSel();open(tid);return}fillSel();render()});
 document.querySelectorAll("[data-fx]").forEach(el=>el.onchange=()=>{const id=el.dataset.fx,t=list.find(x=>x.id===id);ASGM={...ASGM,[id]:{...secOf(t),...(ASGM[id]||{}),sv:+el.value}};saveASG();if(T&&tid===id)T={...T,sv:+el.value};fillSel();render()});
 if($("mv"))$("mv").onchange=e=>{const[a,b]=e.target.value.split("|"),id=tid;ASGM={...ASGM,[id]:{...(ASGM[id]||{}),series:a,cat:b}};saveASG();setCtx(a,b);open(id)};
 if($("nr"))$("nr").onchange=e=>{T={...T,noRank:e.target.checked};save()};
 if($("fin"))$("fin").onclick=()=>{if(!sure("fin","Kliknij jeszcze raz, aby ZAKOŃCZYĆ i zablokować turniej. W aplikacji nie da się tego cofnąć."))return;T={...T,locked:true};save();render()};
 $("ren").onclick=()=>np("ren",T.name,false);
 document.querySelectorAll(".s input").forEach(el=>el.onchange=()=>setScore(el.dataset.m,+el.dataset.i,el.value))
}
function fillSel(){$("sel").innerHTML=vlist().map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join("");
 $("tl").innerHTML=vlist().length?vlist().map(t=>{const d=tdate(t);return '<button class="tc'+(t.id===tid?' on':'')+'" data-id="'+t.id+'"><b>'+(t.locked?'🔒 ':'')+esc(t.name)+'</b><small>'+(t.size||16)+' zawodników'+(t.fmt==="rr"?' · każdy z każdym':'')+(d?' · '+fd(d).slice(0,5):'')+'</small></button>'}).join(''):'<span class="note">Brak turniejów – utwórz pierwszy.</span>';
 $("tl").querySelectorAll(".tc").forEach(b=>b.onclick=()=>open(b.dataset.id))}
function open(id){tid=id;fillSel();if(unsubT){unsubT();unsubT=null}
 const t=list.find(x=>x.id===id);T=t?{name:t.name,players:t.players,scores:t.scores||{},wins:t.wins||{},size:t.size||16,stats:t.stats||{},locked:!!t.locked,noRank:!!t.noRank,created:t.created,series:t.series||'metro',cat:t.cat||'',fmt:t.fmt||'ko',draw:!!t.draw,sv:svOf(t)}:null;if(!T&&!id)draft();render();
 if(db&&id)unsubT=db.doc("tournaments/"+id).onSnapshot(s=>{if(s.exists){const d=s.data();T={name:d.name,players:d.players||[],scores:d.scores||{},wins:d.wins||{},size:d.size||16,stats:d.stats||{},locked:!!d.locked,noRank:!!d.noRank,created:d.created,series:d.series||'metro',cat:d.cat||'',fmt:d.fmt||'ko',draw:!!d.draw,sv:svOf({id,sv:d.sv})};render()}},e=>status('⚠ Błąd odbioru na żywo: '+((e&&(e.code||e.message))||''),true))}
$("sel").onchange=e=>open(e.target.value);
$("new").onclick=()=>np("new","Turniej "+new Date().toLocaleDateString("pl"),true);
renderCtx();
const setView=v=>{view=v;$("tt").classList.toggle("on",v!=="r");$("rk").classList.toggle("on",v==="r");render();window.scrollTo(0,0)};
$("tt").onclick=()=>setView("t");$("rk").onclick=()=>setView("r");
$("nc").onclick=npGo;$("nx").onclick=()=>{$("np").hidden=true};
$("del").onclick=async()=>{if(!tid){status("Nie ma zapisanego turnieju do usunięcia.",true);return}
 if(!sure("del","Kliknij „Usuń” jeszcze raz, aby usunąć ten turniej."))return;
 if(db){try{await db.doc("tournaments/"+tid).delete();status("Turniej usunięty")}catch(e){status("⚠ Nie można usunąć: "+(e.code||e.message),true);return}}else{list=list.filter(x=>x.id!==tid)}
 tid=null;T=null;if(unsubT){unsubT();unsubT=null}
 if(!db)fillSel();draft();render()};
(async()=>{
 try{db=makeDb()}catch(e){db=null}
 loadRole();applyRole();if(db)startPresence();if(isAdmin)watchPresence();
 if(!db){$("lv").textContent="⚪ Tryb lokalny";$("note").textContent="Baza danych niedostępna – dane tylko na czas tej sesji (uzupełnij konfigurację Firebase w pliku).";draft();fillSel();render();return}
 $("note").textContent="Dane zapisują się w bazie i synchronizują na żywo. (projekt: "+firebaseConfig.projectId+")";
 db.collection("tournaments").onSnapshot(s=>{
  $("lv").textContent=s.fromCache?"🟠 Łączenie z bazą…":"🟢 Na żywo";RKD={};s.docs.filter(d=>d.id.startsWith('_ranking')).forEach(d=>RKD[d.id]=d.data());syncRK();if(RKD._ranking_assign)ASGM=RKD._ranking_assign.map||{};
  list=s.docs.filter(d=>!d.id.startsWith('_ranking')).map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created||0)-(a.created||0));
  if(!tid||!vlist().find(x=>x.id===tid)){const v=vlist();tid=v[0]?v[0].id:null;fillSel();open(tid)}else fillSel();if(view==="r")render()},
  e=>{$("lv").textContent="🔴 Brak połączenia z bazą";$("note").textContent="Nie udało się odczytać bazy: "+((e&&(e.code||e.message))||"nieznany błąd")+" (adres strony: "+location.host+")";$("note").style.color="#ff7b7b";render()});
})();

$("lg").onclick=()=>{if(canWrite){isAdmin=false;canWrite=false;saveRole(null);applyRole();render();return}$("pp").hidden=false;window.scrollTo(0,0);$("pin").focus()};
$("pg").onclick=()=>{const v=$("pin").value.trim();
 if(v===PIN_ADMIN){isAdmin=true;canWrite=true;roleName="Administrator";saveRole("admin")}else if(v===PIN_SEDZIA){isAdmin=true;canWrite=true;roleName="Sędzia (pełne uprawnienia)";saveRole("sedzia")}else{status("Zły PIN",true);return}
 $("pin").value="";$("pp").hidden=true;status("");applyRole();render()};
